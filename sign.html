
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - SnapCart</title>
    <link rel="stylesheet" href="signin.css">
</head>
<body>

    <div class="logo">
        <a href="index.html">snap<span>cart</span></a>
    </div>

    <div class="signin-container">
        <h2>Sign in</h2>

        <form action="#" method="post">
            <label for="email">Email or mobile phone number</label>
            <input type="text" id="email" name="email"
                   placeholder="Enter your email or mobile number" required>

            <label for="password">Password</label>
            <input type="password" id="password" name="password"
                   placeholder="Enter your password" required>

            <button type="submit" class="continue-btn">Sign in</button>

            <p class="terms">
                By continuing, you agree to SnapCart's
                <a href="#">Conditions of Use</a> and
                <a href="#">Privacy Notice</a>.
            </p>

            <hr>

            <a href="#" class="forgot">Forgot your password?</a>
        </form>
    </div>

    <div class="new-account">
        <p>New to SnapCart?</p>
        <a href="login.html" class="create-btn">
            Create your SnapCart account
        </a>
    </div>

    <footer>
        <div>
            <a href="#">Conditions of Use</a>
            <a href="#">Privacy Notice</a>
            <a href="#">Help</a>
        </div>
        <p>© 2026 SnapCart. All rights reserved.</p>
    </footer>

</body>
</html>
